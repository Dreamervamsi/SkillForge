[project]
name = "server"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "vamsi krishna", email = "kvamsi.nellore@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.143.3",
    "google-genai>=2.31.0",
    "prisma>=0.15.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
]

[project.scripts]
server = "server:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
